<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maker School</title>
  </head>
  <body>
    <p>Membuka Maker School…</p>
    <script>
      const base = "/maker-school/";
      const relativePath = window.location.pathname.startsWith(base) ? window.location.pathname.slice(base.length).replace(/^\/+/, "") : "";
      window.location.replace(base + (relativePath ? `#/${relativePath}` : "") + window.location.search);
    </script>
  </body>
</html>
